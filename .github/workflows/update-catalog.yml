name: Reseller Catalog Sync

on:
  schedule:
    - cron: '0 */6 * * *'  
  workflow_dispatch:       

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one server fails, let the others keep going
      matrix:
        # These names must exactly match how they are written in your Supabase 'vendors' table
        vendor:
          - "Muzammil Surat"
          - "Bag4u by Dolly"
          - "Bagworld by Dolly"
          - "Le Brouges Bags"
          - "Le Brouges Sneakers"
          - "NM Official"
          - "Drape Studio"
          - "Yusuf Surat Royal Shoes"
          - "Yusuf Surat Shoe Mart"
          - "Yusuf Surat Shoe Trendz"
          - "Yusuf Surat Metro Kicks"
          - "Yusuf Surat Foot Locker"
          - "Yusuf Surat Classy Shoes"
          - "Farhan Surat Bagmania"
          - "Farhan Surat Kicksmania"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright beautifulsoup4 supabase
          playwright install chromium

      - name: Run Scraper Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_VENDOR: ${{ matrix.vendor }}
        run: python scraper.py
