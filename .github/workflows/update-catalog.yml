name: Parallel Multi-Store Scraper

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-vendor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store:
          - name: "Le Brouges Sneakers"
            url: "https://le-brouges-resell.cartpe.in"
            slug: "le_brouges_sneakers"
          - name: "Bagworld by Dolly"
            url: "https://bagworld1.cartpe.in"
            slug: "bagworld1"
          - name: "Bag4u by Dolly"
            url: "https://bag4u.cartpe.in"
            slug: "bag4u"
          - name: "Muzammil Surat"
            url: "https://mtcollection.cartpe.in"
            slug: "mtcollection"
          - name: "Le Brouges Bags"
            url: "https://lebrouges-bags.cartpe.in"
            slug: "lebrouges_bags"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests
          playwright install chromium

      - name: Scrape Single Store
        run: python scraper.py "${{ matrix.store.name }}" "${{ matrix.store.url }}" "${{ matrix.store.slug }}"

      - name: Upload Store Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ matrix.store.slug }}
          path: ${{ matrix.store.slug }}.json

  merge-catalogs:
    needs: scrape-vendor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download all store artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge JSON files
        run: |
          python -c "
          import json, glob, os
          merged = []
          for f in glob.glob('artifacts/**/*.json', recursive=True):
              try:
                  with open(f, 'r', encoding='utf-8') as infile:
                      data = json.load(infile)
                      merged.extend(data)
              except Exception as e:
                  print(f'Error reading {f}: {e}')
          for i, item in enumerate(merged, start=1):
              item['id'] = i
          with open('catalog.json', 'w', encoding='utf-8') as outfile:
              json.dump(merged, outfile, indent=2, ensure_ascii=False)
          print(f'Merged {len(merged)} total products into catalog.json')
          "

      - name: Commit and Push catalog.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m "Automated parallel catalog update" || exit 0
          git push
