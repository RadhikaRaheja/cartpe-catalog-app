name: Cloud Scraper Engine

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Le Brouges Sneakers"
            url: "https://le-brouges-resell.cartpe.in"
            path: "men-rsquo-s-shoe-footwear.html"
            slug: "lebrouges_sneakers_men"
          - name: "Bagworld by Dolly"
            url: "https://bagworld1.cartpe.in"
            path: "allcategory.html"
            slug: "bagworld_all"
          - name: "Bag4u by Dolly"
            url: "https://bag4u.cartpe.in"
            path: "allcategory.html"
            slug: "bag4u_all"
          - name: "Muzammil Surat"
            url: "https://mtcollection.cartpe.in"
            path: "allcategory.html"
            slug: "mtcollection_all"
          - name: "Le Brouges Bags"
            url: "https://lebrouges-bags.cartpe.in"
            path: "allcategory.html"
            slug: "lebrouges_bags_all"
          - name: "NM Official"
            url: "https://nmofficial.cartpe.in"
            path: "allcategory.html"
            slug: "nm_official_all"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 supabase
          playwright install chromium

      - name: Scrape & Push to Cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper.py "${{ matrix.name }}" "${{ matrix.url }}" "${{ matrix.path }}" "${{ matrix.slug }}"
