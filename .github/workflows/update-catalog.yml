name: High-Speed Parallel Scraper

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_vendor:
        description: 'Vendor to update (Leave "all" to scrape everything)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  scrape-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Le Brouges Sneakers Segments
          - name: "Le Brouges Sneakers"
            url: "https://le-brouges-resell.cartpe.in"
            path: "men-rsquo-s-shoe-footwear.html"
            slug: "lebrouges_sneakers_men"
          - name: "Le Brouges Sneakers"
            url: "https://le-brouges-resell.cartpe.in"
            path: "flipflops-footwear.html"
            slug: "lebrouges_sneakers_flipflops"

          # Bagworld Segments
          - name: "Bagworld by Dolly"
            url: "https://bagworld1.cartpe.in"
            path: "allcategory.html"
            slug: "bagworld_all"

          # Bag4u Segments
          - name: "Bag4u by Dolly"
            url: "https://bag4u.cartpe.in"
            path: "allcategory.html"
            slug: "bag4u_all"

          # Muzammil Surat Segments
          - name: "Muzammil Surat"
            url: "https://mtcollection.cartpe.in"
            path: "allcategory.html"
            slug: "mtcollection_all"

          # Le Brouges Bags Segments
          - name: "Le Brouges Bags"
            url: "https://lebrouges-bags.cartpe.in"
            path: "allcategory.html"
            slug: "lebrouges_bags_all"

          # NM Official Segments
          - name: "NM Official"
            url: "https://nmofficial.cartpe.in"
            path: "allcategory.html"
            slug: "nm_official_all"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape Segment
        run: |
          python scraper.py "${{ matrix.name }}" "${{ matrix.url }}" "${{ matrix.path }}" "${{ matrix.slug }}"

      - name: Upload Segment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ matrix.slug }}
          path: ${{ matrix.slug }}.json

  merge-segments:
    needs: scrape-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download all segment artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge & Deduplicate
        run: |
          python -c "
          import json, glob, os
          merged = []
          seen_urls = set()
          for f in glob.glob('artifacts/**/*.json', recursive=True):
              try:
                  with open(f, 'r', encoding='utf-8') as infile:
                      data = json.load(infile)
                      for item in data:
                          if item.get('url') not in seen_urls:
                              seen_urls.add(item.get('url'))
                              merged.append(item)
              except Exception as e:
                  print(f'Error reading {f}: {e}')
          for i, item in enumerate(merged, start=1):
              item['id'] = i
          with open('catalog.json', 'w', encoding='utf-8') as outfile:
              json.dump(merged, outfile, indent=2, ensure_ascii=False)
          print(f'Successfully merged {len(merged)} unique items into catalog.json')
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m "High-speed parallel catalog update" || exit 0
          git push
