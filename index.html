<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reseller Catalog</title>
  <style>
    :root {
      --primary: #25D366;
      --dark: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--dark); color: var(--text); padding: 1rem; }
    header { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input, select, button {
      padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #333;
      background: var(--card-bg); color: var(--text); font-size: 0.95rem;
    }
    input { flex: 2; min-width: 180px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2a2a2a; }
    
    /* Image Gallery CSS */
    .image-scroller {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      background: #000;
    }
    .image-scroller::-webkit-scrollbar { height: 6px; }
    .image-scroller::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
    .image-scroller img {
      width: 100%; height: 250px; object-fit: cover;
      scroll-snap-align: start; flex-shrink: 0;
    }

    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .title { font-size: 1rem; font-weight: 600; }
    .price { color: var(--primary); font-size: 1.1rem; font-weight: bold; }
    .btn-share {
      background: var(--primary); color: #000; border: none; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-top: auto; padding: 0.7rem; border-radius: 6px;
    }
    #emptyMsg { text-align: center; color: var(--text-muted); margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <h1>Reseller Catalog</h1>
    <div class="controls">
      <input type="text" id="search" placeholder="Search models..." oninput="filterProducts()"/>
      <select id="stockFilter" onchange="filterProducts()">
        <option value="all">All Items</option>
        <option value="in_stock">In Stock</option>
      </select>
    </div>
  </header>

  <div class="grid" id="productGrid"></div>
  <div id="emptyMsg" style="display: none;">Loading or no products found...</div>

  <script>
    let catalog = [];

    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json?t=' + new Date().getTime());
        catalog = await res.json();
      } catch (err) {
        document.getElementById('emptyMsg').innerText = "Run the scraper in GitHub Actions first to generate catalog.json!";
      }
      render(catalog);
    }

    function render(items) {
      const container = document.getElementById('productGrid');
      const emptyMsg = document.getElementById('emptyMsg');
      if (!items || items.length === 0) {
        container.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      container.innerHTML = items.map(item => `
        <div class="card">
          <div class="image-scroller">
            ${item.images.map(img => `<img src="${img}" loading="lazy" />`).join('')}
          </div>
          <div class="card-body">
            <div class="title">${item.title}</div>
            <div class="price">${item.price}</div>
            <div style="font-size: 0.8rem; color: #a0a0a0;">${item.in_stock ? '🟢 Available' : '🔴 Out of Stock'}</div>
            <button class="btn-share" onclick="shareToWhatsApp(${item.id})">
              Share to WhatsApp
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      const q = document.getElementById('search').value.toLowerCase();
      const stock = document.getElementById('stockFilter').value;
      const filtered = catalog.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(q);
        const matchesStock = stock === 'all' || (stock === 'in_stock' && item.in_stock);
        return matchesQuery && matchesStock;
      });
      render(filtered);
    }

    async function shareToWhatsApp(id) {
      const item = catalog.find(p => p.id === id);
      if (!item) return;

      // NO ORIGINAL URL INCLUDED. JUST YOUR DATA.
      const shareText = `*${item.title}*\nPrice: ${item.price}\n\nDM to place your order!`;

      // Attempt to share multiple images on mobile
      if (navigator.canShare && item.images.length > 0) {
        try {
          const filesArray = [];
          for (let i = 0; i < item.images.length; i++) {
             const response = await fetch(item.images[i]);
             const blob = await response.blob();
             filesArray.push(new File([blob], `shoe_${i}.jpg`, { type: blob.type }));
          }

          if (navigator.canShare({ files: filesArray })) {
            await navigator.share({
              files: filesArray,
              text: shareText
            });
            return;
          }
        } catch (e) {
          console.log("Multi-image share failed, falling back to text.", e);
        }
      }

      // Fallback for Desktop/Laptops
      if (item.images.length > 0 && navigator.clipboard && window.ClipboardItem) {
        try {
          const response = await fetch(item.images[0]);
          const blob = await response.blob();
          await navigator.clipboard.write([
            new ClipboardItem({ [blob.type]: blob })
          ]);
          alert("Main image copied to clipboard! Paste it into the WhatsApp chat.");
        } catch (err) {}
      }

      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      window.open(waUrl, '_blank');
    }

    window.onload = loadCatalog;
  </script>
</body>
</html>
