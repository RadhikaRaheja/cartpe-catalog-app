<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reseller Pro Hub</title>
  <style>
    :root { --primary: #25D366; --dark: #121212; --card-bg: #1e1e1e; --text: #ffffff; --text-muted: #a0a0a0; --modal-bg: #222222; --video-tag: #1da1f2; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--dark); color: var(--text); padding: 1rem; }
    header { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input, select, button { padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid #333; background: var(--card-bg); color: var(--text); font-size: 0.95rem; }
    .search-box { display: flex; flex: 2; min-width: 240px; gap: 0.2rem; }
    .search-box input { flex: 1; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .btn-mic { background: var(--primary); color: #000; border: none; border-top-right-radius: 8px; border-bottom-right-radius: 8px; cursor: pointer; font-weight: bold; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2a2a2a; }
    .media-scroller { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #000; height: 260px; }
    .media-scroller::-webkit-scrollbar { height: 5px; }
    .media-scroller::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    .media-scroller img, .media-scroller video { width: 100%; height: 260px; object-fit: cover; scroll-snap-align: start; flex-shrink: 0; }
    
    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .meta-tags { display: flex; gap: 0.5rem; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; flex-wrap: wrap; }
    .badge-video { color: var(--video-tag); }
    .title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.2rem; }
    .base-price { color: var(--text-muted); font-size: 0.85rem; text-decoration: line-through; }
    .stock-tag { font-size: 0.8rem; font-weight: bold; }
    .in-stock { color: var(--primary); } .out-of-stock { color: #ff4444; }
    .btn-action { background: var(--primary); color: #000; border: none; font-weight: bold; cursor: pointer; padding: 0.8rem; border-radius: 6px; margin-top: auto; }
    
    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
    .modal { background: var(--modal-bg); width: 90%; max-width: 420px; padding: 1.5rem; border-radius: 12px; display: flex; flex-direction: column; gap: 0.9rem; border: 1px solid #333; }
    .quick-adds { display: flex; gap: 0.4rem; }
    .quick-adds button { flex: 1; background: #333; border: none; cursor: pointer; padding: 0.5rem; color: #fff; }
    textarea { width: 100%; height: 140px; padding: 0.6rem; border-radius: 8px; background: var(--card-bg); color: #fff; border: 1px solid #444; resize: none; }
    .media-buttons { display: flex; gap: 0.5rem; flex-direction: column; }
    .btn-media { background: #2c3e50; color: #fff; border: none; cursor: pointer; padding: 0.6rem; border-radius: 6px;}
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .modal-actions button { flex: 1; font-weight: bold; cursor: pointer; padding: 0.8rem; border-radius: 6px;}
    .btn-cancel { background: #444; color: #fff; border: none; }
    .btn-confirm { background: var(--primary); color: #000; border: none; }
    
    #statusMessage { text-align: center; padding: 3rem 1rem; color: #a0a0a0; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>Reseller Pro Hub</h1>
      <button onclick="openManualAddModal()">+ Add Custom Item</button>
    </div>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="search" placeholder="Search shoes, bags, brands..." oninput="filterProducts()"/>
        <button class="btn-mic" onclick="startVoiceSearch()">🎤</button>
      </div>
      <select id="vendorFilter" onchange="filterProducts()"><option value="all">All Vendors</option></select>
      <select id="categoryFilter" onchange="filterProducts()">
        <option value="all">All Categories</option>
        <option value="footwear">Footwear</option>
        <option value="bag">Bags & Clutches</option>
        <option value="accessory">Accessories / Misc</option>
      </select>
    </div>
  </header>

  <div id="statusMessage">Fetching your catalog...<br><br><small>(If this stays here, check your GitHub Actions tab to see if the scraper is still running or failed.)</small></div>
  <div class="grid" id="productGrid"></div>

  <!-- Share & Custom Price Modal -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <h3>Edit & Share</h3>
      <div id="modalTitle" style="font-weight:bold; color:var(--primary); font-size:0.95rem;"></div>
      <div style="color:#fff;">Base Price: ₹<span id="modalBasePrice">0</span></div>

      <div class="quick-adds">
        <button onclick="addMarkup(300)">+₹300</button>
        <button onclick="addMarkup(500)">+₹500</button>
        <button onclick="addMarkup(800)">+₹800</button>
      </div>

      <input type="number" id="finalPrice" placeholder="Final Selling Price (₹)" oninput="updateMessagePreview()"/>
      
      <textarea id="customMessage"></textarea>

      <div class="media-buttons">
        <button class="btn-media" id="copyImgBtn" onclick="copyMainImage()">📋 Copy Main Image</button>
        <button class="btn-media" id="dlVideoBtn" style="display:none;" onclick="downloadProductVideo()">🎥 Download HD Video</button>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="executeShare()">Share to WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    let catalog = [];
    let currentItem = null;

    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error("File not found");
        catalog = await res.json();
        localStorage.setItem('cached_catalog', JSON.stringify(catalog));
      } catch (err) {
        catalog = JSON.parse(localStorage.getItem('cached_catalog') || '[]');
      }
      
      const statusMsg = document.getElementById('statusMessage');
      if (catalog.length === 0) {
        statusMsg.innerHTML = "<strong>No products found!</strong><br><br>Wait 3-5 minutes for the GitHub Action to finish running, then refresh this page.";
      } else {
        statusMsg.style.display = 'none';
        populateFilters();
        filterProducts();
      }
    }

    function populateFilters() {
      const vendors = [...new Set(catalog.map(i => i.vendor).filter(Boolean))];
      const vSelect = document.getElementById('vendorFilter');
      vSelect.innerHTML = '<option value="all">All Vendors</option>' + vendors.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function render(items) {
      const container = document.getElementById('productGrid');
      if(items.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#a0a0a0;">No items match your search.</div>';
          return;
      }
      
      container.innerHTML = items.map(item => `
        <div class="card" style="opacity: ${item.in_stock ? '1' : '0.55'}">
          <div class="media-scroller">
            ${(item.images || []).map(img => `<img src="${img}" loading="lazy" />`).join('')}
            ${item.video ? `<video src="${item.video}" controls playsinline preload="none"></video>` : ''}
          </div>
          <div class="card-body">
            <div class="meta-tags">
              <span>${item.vendor || 'Unknown'}</span> • <span>${item.category || 'General'}</span>
              ${item.video ? '<span class="badge-video">🎥 VIDEO</span>' : ''}
            </div>
            <div class="title">${item.title}</div>
            <div class="price-row">
              <span class="base-price">Base: ₹${item.base_price || 0}</span>
              <span class="stock-tag ${item.in_stock ? 'in-stock' : 'out-of-stock'}">
                ${item.in_stock ? 'IN STOCK' : 'OUT OF STOCK'}
              </span>
            </div>
            <button class="btn-action" onclick="openShareModal(${item.id})">Edit & Share</button>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      const q = document.getElementById('search').value.toLowerCase();
      const vendor = document.getElementById('vendorFilter').value;
      const cat = document.getElementById('categoryFilter').value;
      const filtered = catalog.filter(item => {
        const titleMatch = (item.title || "").toLowerCase().includes(q);
        const vendorMatch = (item.vendor || "").toLowerCase().includes(q);
        return (titleMatch || vendorMatch) &&
               (vendor === 'all' || item.vendor === vendor) &&
               (cat === 'all' || item.category === cat);
      });
      render(filtered);
    }

    // Dynamic Text Generation based on Category
    function generateDescription(item, sellingPrice) {
      if (item.category === 'footwear') {
        return `*${item.title}*\n\nQuality: Top Notch Assurance\nSizes Available: UK 6 to 10 (Confirm in DM)\n\nPrice: ₹${sellingPrice} (Free Shipping Included)`;
      } else if (item.category === 'bag') {
        return `*${item.title}* 😻💯\n\nQuality: Premium ✌️😍\nIncludes: Original Brand Box, Dust Bag & Tags\n\nPrice: ₹${sellingPrice}`;
      } else {
        return `*${item.title}* ✨\n\nPremium Edition\n\nPrice: ₹${sellingPrice}`;
      }
    }

    function openShareModal(id) {
      currentItem = catalog.find(p => p.id === id);
      document.getElementById('modalTitle').innerText = currentItem.title;
      document.getElementById('modalBasePrice').innerText = currentItem.base_price;
      
      const defaultMarkup = currentItem.category === 'bag' ? 800 : 500; 
      document.getElementById('finalPrice').value = currentItem.base_price + defaultMarkup;
      
      updateMessagePreview();
      
      const dlBtn = document.getElementById('dlVideoBtn');
      dlBtn.style.display = currentItem.video ? 'block' : 'none';
      document.getElementById('shareModal').style.display = 'flex';
    }

    function updateMessagePreview() {
      const price = document.getElementById('finalPrice').value;
      document.getElementById('customMessage').value = generateDescription(currentItem, price);
    }

    function addMarkup(amt) {
      document.getElementById('finalPrice').value = parseInt(document.getElementById('modalBasePrice').innerText) + amt;
      updateMessagePreview();
    }

    function closeModal() { document.getElementById('shareModal').style.display = 'none'; }

    async function copyMainImage() {
      if (!currentItem.images || !currentItem.images.length) return;
      try {
        const res = await fetch(currentItem.images[0]);
        const blob = await res.blob();
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        alert("Main image copied to clipboard!");
      } catch (err) {
        alert("Clipboard copy unsupported here. Long-press the image to copy.");
      }
    }

    function downloadProductVideo() {
      if (!currentItem.video) return;
      const a = document.createElement('a');
      a.href = currentItem.video;
      a.download = `video.mp4`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function executeShare() {
      const shareText = document.getElementById('customMessage').value;

      if (navigator.canShare) {
        try {
          let mediaFiles = [];
          if (currentItem.video) {
            const vRes = await fetch(currentItem.video);
            const vBlob = await vRes.blob();
            mediaFiles.push(new File([vBlob], 'product_video.mp4', { type: 'video/mp4' }));
          } else if (currentItem.images && currentItem.images.length > 0) {
            const iRes = await fetch(currentItem.images[0]);
            const iBlob = await iRes.blob();
            mediaFiles.push(new File([iBlob], 'product_image.jpg', { type: iBlob.type }));
          }

          if (mediaFiles.length && navigator.canShare({ files: mediaFiles })) {
            await navigator.share({ files: mediaFiles, text: shareText });
            closeModal();
            return;
          }
        } catch (e) { console.log("Native share fallback."); }
      }

      if (currentItem.video) {
        downloadProductVideo();
        alert("Video download started! Drag and drop it into WhatsApp Web.");
      }
      
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      window.open(waUrl, '_blank');
      closeModal();
    }

    function openManualAddModal() {
      const title = prompt("Enter Product Title:");
      if (!title) return;
      const price = prompt("Enter Base Price (₹):");
      const img = prompt("Paste Image URL:");
      const video = prompt("Paste Video URL (Optional):");

      const item = {
        id: Date.now(), vendor: 'Custom Item', category: 'accessory',
        title: title, base_price: parseInt(price) || 0, in_stock: true,
        images: [img || 'https://via.placeholder.com/300'],
        video: video || null
      };

      catalog.unshift(item);
      populateFilters();
      filterProducts();
    }

    function startVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { alert("Voice search is not supported in this browser."); return; }
      const rec = new SpeechRecognition();
      rec.lang = 'en-IN';
      rec.onresult = (e) => {
        document.getElementById('search').value = e.results[0][0].transcript;
        filterProducts();
      };
      rec.start();
    }

    window.onload = loadCatalog;
  </script>
</body>
</html>
