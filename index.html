<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalog Manager & WhatsApp Sharer</title>
  <style>
    :root {
      --primary: #25D366;
      --dark: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--dark); color: var(--text); padding: 1rem; }
    header { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    input, select, button {
      padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #333;
      background: var(--card-bg); color: var(--text); font-size: 0.95rem;
    }
    input { flex: 1; min-width: 200px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }
    .card {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; border: 1px solid #2a2a2a;
    }
    .card img { width: 100%; height: 220px; object-fit: cover; background: #000; }
    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .title { font-size: 1rem; font-weight: 600; }
    .price { color: var(--primary); font-size: 1.1rem; font-weight: bold; }
    .status-badge {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: bold; width: fit-content;
    }
    .in-stock { background: rgba(37, 211, 102, 0.2); color: var(--primary); }
    .out-of-stock { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
    .btn-share {
      background: var(--primary); color: #000; border: none; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-top: auto; padding: 0.7rem; border-radius: 6px;
    }
    .btn-share:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>Product Catalog</h1>
    <div class="controls">
      <input type="text" id="search" placeholder="Search sneakers, slides, brands..." oninput="filterProducts()"/>
      <select id="stockFilter" onchange="filterProducts()">
        <option value="all">All Items</option>
        <option value="in_stock">In Stock Only</option>
        <option value="out_of_stock">Out of Stock</option>
      </select>
    </div>
  </header>

  <div class="grid" id="productGrid"></div>

  <script>
    let catalog = [];

    // Load catalog from local memory / JSON file
    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json');
        catalog = await res.json();
        // Save to browser memory
        localStorage.setItem('cached_catalog', JSON.stringify(catalog));
      } catch (err) {
        console.warn("Using offline storage...");
        catalog = JSON.parse(localStorage.getItem('cached_catalog') || '[]');
      }
      render(catalog);
    }

    function render(items) {
      const container = document.getElementById('productGrid');
      container.innerHTML = items.map(item => `
        <div class="card">
          <img src="${item.images[0] || 'https://via.placeholder.com/300'}" alt="${item.title}" loading="lazy"/>
          <div class="card-body">
            <span class="status-badge ${item.in_stock ? 'in-stock' : 'out-of-stock'}">
              ${item.in_stock ? 'IN STOCK' : 'OUT OF STOCK'}
            </span>
            <div class="title">${item.title}</div>
            <div class="price">${item.price}</div>
            <button class="btn-share" onclick="shareToWhatsApp(${item.id})">
              Share to WhatsApp
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      const q = document.getElementById('search').value.toLowerCase();
      const stock = document.getElementById('stockFilter').value;

      const filtered = catalog.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(q);
        const matchesStock = stock === 'all' || 
          (stock === 'in_stock' && item.in_stock) || 
          (stock === 'out_of_stock' && !item.in_stock);
        return matchesQuery && matchesStock;
      });
      render(filtered);
    }

    // Unified Cross-Platform Share Function
    async function shareToWhatsApp(id) {
      const item = catalog.find(p => p.id === id);
      if (!item) return;

      const shareText = `*${item.title}*\nPrice: ${item.price}\nStatus: ${item.in_stock ? 'In Stock' : 'Out of Stock'}\nLink: ${item.url}`;

      // 1. Mobile & Tablet: Web Share API (Direct Media Sharing)
      if (navigator.canShare && item.images.length > 0) {
        try {
          const response = await fetch(item.images[0]);
          const blob = await response.blob();
          const file = new File([blob], 'product.jpg', { type: blob.type });

          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: item.title,
              text: shareText
            });
            return;
          }
        } catch (e) {
          console.log("Web Share fallback triggered.");
        }
      }

      // 2. Desktop / Laptop Fallback (Copy Image + Open WhatsApp Web)
      if (item.images.length > 0 && navigator.clipboard && window.ClipboardItem) {
        try {
          const response = await fetch(item.images[0]);
          const blob = await response.blob();
          await navigator.clipboard.write([
            new ClipboardItem({ [blob.type]: blob })
          ]);
          alert("Product image copied to clipboard! Paste it into the WhatsApp chat.");
        } catch (err) {
          console.log("Could not auto-copy image.");
        }
      }

      // Open WhatsApp with prefilled message
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      window.open(waUrl, '_blank');
    }

    window.onload = loadCatalog;
  </script>
</body>
</html>
